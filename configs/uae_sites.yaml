# ---------------------------------------------------------------------------
# Occupational pillar: 15 real UAE industrial / construction / logistics sites.
#
# Coordinates are from OpenStreetMap (Nominatim, geocoded 2026-11-16); the OSM
# object each point came from is in `osm`. h3_res8 = h3.latlng_to_cell(lat, lon, 8)
# (h3-py 4.x); tests/test_occupational.py checks it stays in sync with lat/lon.
#
# The site names and operators are real. worker_count, shift_pattern and
# heat_exposure are MODELLED assumptions, not operator-published figures. Every
# worker attached to these sites is synthetic (docs/ETHICS.md).
#
# sector:        construction | logistics | industrial | ports | aviation
# shift_pattern: double_12h | triple_8h | day_only
# heat_exposure: outdoor | mixed | indoor_hot | indoor_cool
# ---------------------------------------------------------------------------
sites:
