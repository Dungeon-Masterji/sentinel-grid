# Ground-truth UAE events for the backtest (packages/pipelines/backtest).
#
# Times are Asia/Dubai (+04:00). Each event cites a public source. Where the brief and
# the official record disagree, the record wins and the event says so in `notes`.
#
# affected_hexes: "auto" = every fusion unit (site hex) in affected_emirates. That is
# deliberately broad: all 15 sites are in Abu Dhabi or Dubai, none in Al Ain or deep
# Al Dhafra, so an Al Ain heatwave can only be matched at emirate level. A list of
# H3 res-7 cells overrides it.
#
# event_type -> scenarios that are EXPECTED to catch it (sensitivity / PPV use this map;
# the coverage matrix scores every scenario against every event type regardless).
version: 1

scenario_map:
  heatwave: [heat-stress-cluster]
  ramadan_stress: [heat-stress-cluster]
  dust_storm: [respiratory-dust-event]
  pollution_episode: [respiratory-dust-event]
  heat_wave_combined_with_dust: [heat-stress-cluster, respiratory-dust-event]
  flood: [respiratory-dust-event, infectious-cluster-signal]   # no flood scenario exists; plausibility only
  infectious_cluster: [infectious-cluster-signal]              # no real-world events listed (see methodology)

matching:
  lead_window_hours: 72     # an alert up to 72 h before event start counts as an early warning
  grace_hours: 12           # ... and up to 12 h after event end
  calibration_bins: 10

events:
  # ---------------------------------------------------------------- heatwaves
  - id: heat-2023-07-15
    label: "First 50 °C days of 2023 (Sweihan / Al Dhafra)"
    event_type: heatwave
    start_time: "2023-07-14T00:00:00+04:00"
    end_time: "2023-07-17T23:59:59+04:00"
    peak_time: "2023-07-15T14:00:00+04:00"
    affected_emirates: [Abu Dhabi]
    affected_hexes: auto
    severity_truth: severe
    peak_value: "50.1 °C (NCM)"
    source_url: https://www.thenationalnews.com/uae/2023/07/16/uae-weather-temperatures-cross-50c-for-the-first-time-in-2023
    notes: Outlets disagree on the station (Sweihan vs Bada Dafas, Al Dhafra).

  - id: heat-2024-06-15
