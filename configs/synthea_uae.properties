# Sentinel Grid — Synthea overrides for a UAE population.
# Synthetic data generated by Synthea — not real patient records.
#
# Usage (the wrapper does this for you, after copying configs/synthea/resources/
# into synthea/src/main/resources/):
#   cd synthea && ./run_synthea -s 42 -p 10000 -c ../configs/synthea_uae.properties "United Arab Emirates"
# Regenerate the geography/provider CSVs with: python configs/synthea/build_uae_geography.py

# ---- requested keys ---------------------------------------------------------
# NOTE: not a real Synthea property (Synthea has no default-city key; it is ignored).
# Kept for traceability with the spec. Birth-place / residence are driven by the
# demographics + zipcodes files below; the state arg "United Arab Emirates" selects them.
generate.geography.foreign_birthplace.default_city = Dubai
generate.demographics.default_file = geography/demographics/uae_demographics.csv
exporter.fhir.export = true
exporter.csv.export = true
exporter.hospital.fhir.export = false
generate.default_population = 10000
exporter.baseDirectory = ./output/uae/

# ---- keys required to make a non-US geography actually load -----------------
generate.geography.zipcodes.default_file = geography/uae_zipcodes.csv
generate.geography.timezones.default_file = geography/uae_timezones.csv
generate.geography.country_code = AE
generate.geography.passport_uri = http://hl7.org/fhir/sid/passport-ARE

generate.providers.hospitals.default_file = providers/uae/hospitals.csv
generate.providers.longterm.default_file = providers/uae/longterm.csv
generate.providers.nursing.default_file = providers/uae/nursing.csv
generate.providers.rehab.default_file = providers/uae/rehab.csv
generate.providers.hospice.default_file = providers/uae/hospice.csv
generate.providers.dialysis.default_file = providers/uae/dialysis.csv
generate.providers.homehealth.default_file = providers/uae/home_health_agencies.csv
generate.providers.veterans.default_file = providers/uae/va_facilities.csv
generate.providers.urgentcare.default_file = providers/uae/urgent_care_facilities.csv
generate.providers.primarycare.default_file = providers/uae/primary_care_facilities.csv
generate.providers.ihs.hospitals.default_file = providers/uae/ihs_facilities.csv
generate.providers.ihs.primarycare.default_file = providers/uae/ihs_centers.csv

# ---- export shape -----------------------------------------------------------
# Only alive-or-dead patients' recent history matters for a 90-day signal; keep
# 2 years so the parser can compute a baseline without huge bundles.
exporter.years_of_history = 2
exporter.practitioner.fhir.export = false
exporter.fhir.bulk_data = false
exporter.use_uuid_filenames = false

# ---- payers (UAE mandatory-insurance stand-ins; see build_uae_geography.py) ----
generate.payers.insurance_companies.default_file = payers/uae/insurance_companies.csv
generate.payers.insurance_plans.default_file = payers/uae/insurance_plans.csv
generate.payers.insurance_plans.eligibilities_file = payers/uae/insurance_eligibilities.csv

# ---- FHIR size control ------------------------------------------------------
# Only the resource types the clinical pipeline reads. Claims/EOB/DocumentReference/
# DiagnosticReport/Provenance are ~75% of bundle bytes and unused.
# (Patient and Encounter are always included by Synthea.)
exporter.fhir.included_resources = Patient,Encounter,Condition,Observation
