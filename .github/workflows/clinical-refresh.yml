# Nightly clinical pillar refresh.
# Synthetic data generated by Synthea — not real patient records.
#
# 1. Clone Synthea (pinned) on the runner — it is never committed to this repo.
# 2. Generate a seeded UAE population, parse FHIR -> parquet (last 90 days).
# 3. Upload parquets as an artifact AND force-push them as a single orphan commit
#    to branch `data/processed/clinical` (no history growth on main or that branch).
# 4. Dispatch the Azure deploy workflow, which pulls the parquets from that branch.
name: Clinical refresh (nightly Synthea)

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      population:
        description: "Synthetic population size"
        default: "10000"
      seed:
        description: "Synthea seed"
        default: "42"

permissions:
  contents: write   # push the data branch
  actions: write    # dispatch the deploy workflow

concurrency:
  group: clinical-refresh
  cancel-in-progress: false

env:
  SYNTHEA_REPO: https://github.com/synthetichealth/synthea.git
  SYNTHEA_REF: bd8a52ba0a54ad8c6a1004b74787a14d8c25dbcc
  DATA_BRANCH: data/processed/clinical

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-synthea-${{ env.SYNTHEA_REF }}

      - name: Clone Synthea (pinned)
        run: |
          git init synthea
          git -C synthea remote add origin "$SYNTHEA_REPO"
          git -C synthea fetch --depth 1 origin "$SYNTHEA_REF"
          git -C synthea checkout --detach FETCH_HEAD

      - name: Unit tests
        run: python -m pytest -q

      - name: Generate + parse
        env:
          TZ: UTC
        run: |
          python -m packages.pipelines.synth.run_all \
            --population "${{ inputs.population || '10000' }}" \
            --seed "${{ inputs.seed || '42' }}" \
            --window-days 90 --max-mb 50

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinical-parquet-${{ github.run_id }}
          path: data/processed/clinical/*.parquet
          retention-days: 14

      - name: Publish to data branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git checkout --orphan clinical-data-tmp
          git rm -rq --cached .
          cat > data/processed/clinical/README.md <<EOF
          # Clinical parquet snapshot (synthetic)

          Synthetic data generated by Synthea — not real patient records.

          - generated: ${stamp}
          - workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - source commit: ${GITHUB_SHA}
          - Synthea: ${SYNTHEA_REF}
          EOF
          git add -f data/processed/clinical/events.parquet \
                     data/processed/clinical/patients.parquet \
                     data/processed/clinical/README.md
          git commit -qm "data: clinical refresh ${stamp} (synthetic)"
          git push --force origin "HEAD:refs/heads/${DATA_BRANCH}"

      - name: Redeploy API with fresh data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main_sentinel-grid-api.yml --ref main
