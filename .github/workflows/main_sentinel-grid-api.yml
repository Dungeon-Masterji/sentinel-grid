name: Build and deploy Python app to Azure Web App - sentinel-grid-api

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies into .python_packages
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target=".python_packages/lib/site-packages" \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            -r requirements.txt

      - name: Vendor pipeline code used by the API
        # apps/api/routers/clinical.py loads synthea_wrapper via importlib from wwwroot/_vendor;
        # routers/alerts.py loads the LLM narration package (regenerate_narration) as
        # sentinel_explain, plus the scenario config as JSON (no pyyaml on Azure).
        run: |
          set -euo pipefail
          mkdir -p apps/api/_vendor/sentinel_explain/fixtures
          cp packages/pipelines/synth/synthea_wrapper.py apps/api/_vendor/
          cp packages/pipelines/explain/{groq_client,llm,narrate,prompts}.py apps/api/_vendor/sentinel_explain/
          cp packages/pipelines/explain/fixtures/fewshot.json apps/api/_vendor/sentinel_explain/fixtures/
          : > apps/api/_vendor/sentinel_explain/__init__.py
          python -m pip install -q pyyaml
          python -c "import json, yaml; print(json.dumps(yaml.safe_load(open('configs/scenarios.yaml'))))" > apps/api/_vendor/scenarios.json
          # routers/ops.py: alert routing payloads (same code as the pipeline) + channel map
          mkdir -p apps/api/_vendor/sentinel_ops
          cp packages/pipelines/ops/notify.py apps/api/_vendor/sentinel_ops/
          python -c "import json, yaml; print(json.dumps(yaml.safe_load(open('configs/ops_channels.yaml'))))" > apps/api/_vendor/sentinel_ops/ops_channels.json

      - name: Pull clinical parquets from data branch
        # Written nightly by .github/workflows/clinical-refresh.yml. If the branch
        # doesn't exist yet the API still deploys and returns 503 for clinical routes.
        run: |
          set -euo pipefail
          branch=data/processed/clinical
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth 1 origin "$branch"
            mkdir -p apps/api/data/clinical
            for f in events.parquet patients.parquet; do
              git show "FETCH_HEAD:data/processed/clinical/$f" > "apps/api/data/clinical/$f"
            done
            ls -la apps/api/data/clinical
          else
            echo "::warning::no $branch branch yet; deploying without clinical data"
          fi

      - name: Pull alert files from data branch
        # Written every 15 min by alert-refresh.yml. The API also re-pulls them itself
        # (TTL / POST /api/alerts/refresh); this copy just seeds a fresh deploy.
        run: |
          set -euo pipefail
          branch=data/processed/alerts
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth 1 origin "$branch"
            mkdir -p apps/api/data/alerts
            for f in active.parquet signal_traces.parquet fused_traces.parquet units.parquet meta.json; do
              git show "FETCH_HEAD:data/processed/alerts/$f" > "apps/api/data/alerts/$f"
            done
          else
            echo "::warning::no $branch branch yet; deploying without alerts"
          fi

      - name: Pull backtest results from data branch
        # Written weekly by backtest-weekly.yml; the API also re-pulls them hourly.
        run: |
          set -euo pipefail
          branch=data/processed/backtest
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth 1 origin "$branch"
            mkdir -p apps/api/data/backtest
            for f in scorecard.json events.json calibration.json event_traces.parquet; do
              git show "FETCH_HEAD:data/processed/backtest/results/$f" > "apps/api/data/backtest/$f"
            done
          else
            echo "::warning::no $branch branch yet; deploying without backtest results"
          fi

      - name: Build occupational data (synthetic workforce + Open-Meteo)
        # Pulls 90 days of hourly met + CAMS particulates for the 15 sites in
        # configs/uae_sites.yaml, regenerates the seeded synthetic workforce and
        # copies sites / daily rollup / features parquets into the API package.
        # Runs on every deploy (incl. the nightly dispatch from clinical-refresh),
        # so "today" stays current. On failure the API deploys and the occupational
        # routes return 503.
        continue-on-error: true
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}   # optional: PM fallback only
          TZ: UTC
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m packages.pipelines.synth.occupational_run --api-dir apps/api/data/occupational
          ls -la apps/api/data/occupational

      - name: Zip API with bundled deps
        working-directory: apps/api
        run: zip -r ../../release.zip . -x "__pycache__/*" "*.pyc" "venv/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentinel-grid-api
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_8ffdea0e39ff4845bce539b8218b2e67 }}
          package: release.zip
