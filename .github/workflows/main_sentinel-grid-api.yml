name: Build and deploy Python app to Azure Web App - sentinel-grid-api

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip API for deploy
        working-directory: apps/api
        run: zip -r ../../release.zip . -x "__pycache__/*" "*.pyc" ".python_packages/*" "venv/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentinel-grid-api
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_8ffdea0e39ff4845bce539b8218b2e67 }}
          package: release.zip
