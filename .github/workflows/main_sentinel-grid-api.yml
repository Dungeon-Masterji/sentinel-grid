name: Build and deploy Python app to Azure Web App - sentinel-grid-api

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies into target folder
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Zip API for deploy
        working-directory: apps/api
        run: zip -r ../../release.zip . -x "__pycache__/*" "*.pyc"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentinel-grid-api
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_8ffdea0e39ff4845bce539b8218b2e67 }}
          package: release.zip
