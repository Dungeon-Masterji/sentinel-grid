name: Build and deploy Python app to Azure Web App - sentinel-grid-api

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies into .python_packages
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target=".python_packages/lib/site-packages" \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            -r requirements.txt

      - name: Vendor pipeline code used by the API
        # apps/api/routers/clinical.py loads this via importlib from wwwroot/_vendor
        run: |
          mkdir -p apps/api/_vendor
          cp packages/pipelines/synth/synthea_wrapper.py apps/api/_vendor/

      - name: Pull clinical parquets from data branch
        # Written nightly by .github/workflows/clinical-refresh.yml. If the branch
        # doesn't exist yet the API still deploys and returns 503 for clinical routes.
        run: |
          set -euo pipefail
          branch=data/processed/clinical
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --depth 1 origin "$branch"
            mkdir -p apps/api/data/clinical
            for f in events.parquet patients.parquet; do
              git show "FETCH_HEAD:data/processed/clinical/$f" > "apps/api/data/clinical/$f"
            done
            ls -la apps/api/data/clinical
          else
            echo "::warning::no $branch branch yet; deploying without clinical data"
          fi

      - name: Zip API with bundled deps
        working-directory: apps/api
        run: zip -r ../../release.zip . -x "__pycache__/*" "*.pyc" "venv/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentinel-grid-api
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_8ffdea0e39ff4845bce539b8218b2e67 }}
          package: release.zip
